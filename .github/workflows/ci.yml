name: CI

# Pull requests run on GitHub-hosted runners with example data and no secrets. pull_request_target is
# never used, so code from a fork never runs with this repository's permissions.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: district-survey

jobs:
  typescript:
    name: Lint, types, unit and contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          persist-credentials: false
      - uses: ./district-survey/.github/actions/setup
      - run: yarn build-data
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn contracts:lint
      - name: Generated contract types are current
        run: yarn contracts:types && git diff --exit-code -- src/lib/contracts/types.ts
      - name: Survey examples validate
        run: |
          yarn survey:validate examples/survey.example.yaml --settings examples/settings.example.yaml
          yarn survey:validate examples/survey-second-year.example.yaml --previous examples/survey.example.yaml
      - run: yarn test:coverage --reporter=default --reporter=json --outputFile.json=reports/vitest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report
          path: district-survey/reports/vitest.json

  breaking-changes:
    name: OpenAPI breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          fetch-depth: 0
          persist-credentials: false
      - name: Fail on an unversioned breaking change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.11.7/oasdiff_1.11.7_linux_amd64.tar.gz | tar -xz -C /tmp oasdiff
          for spec in contracts/openapi/*.v1.yaml; do
            if git cat-file -e "origin/${BASE_REF}:${spec}" 2>/dev/null; then
              git show "origin/${BASE_REF}:${spec}" > /tmp/base.yaml
              /tmp/oasdiff breaking /tmp/base.yaml "$spec" --fail-on ERR
            fi
          done

  mutation:
    name: Mutation tests for signing and S3 records
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          fetch-depth: 0
          persist-credentials: false
      - name: Did signing or S3 record code change?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}" -- functions/shared/signing.ts functions/shared/s3-records.ts tests/functions; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: ./district-survey/.github/actions/setup
      - if: steps.changed.outputs.run == 'true'
        run: yarn build-data && yarn test:mutation

  terraform:
    name: Terraform module
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: district-survey/infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.61.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - name: terraform test
        run: |
          mkdir -p ../../reports
          terraform test -no-color | tee ../../reports/terraform-test.txt
      - name: terraform validate
        working-directory: district-survey/infra/terraform/tests/root
        run: terraform init -backend=false -input=false && terraform validate
      - run: tflint --init && tflint --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: district-survey/infra/terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-report
          path: district-survey/reports/terraform-test.txt

  workflow-safety:
    name: Workflow safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.8/actionlint_1.7.8_linux_amd64.tar.gz | tar -xz -C /tmp actionlint
          /tmp/actionlint -color
      - name: zizmor
        run: pipx run zizmor==1.16.3 --min-severity medium .github/workflows
      - uses: ./district-survey/.github/actions/setup
      - name: Repository rules
        env:
          DISTRICT_TERMS: ${{ vars.DISTRICT_TERMS }}
        run: yarn vitest run tests/repo

  browser:
    name: Browser and accessibility tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          persist-credentials: false
      - uses: ./district-survey/.github/actions/setup
      - run: yarn playwright install --with-deps chromium firefox webkit
      - name: Moto, as DistrictWorkflow runs it
        run: docker run --rm -d --name moto -p 127.0.0.1:4566:4566 -e MOTO_PORT=4566 motoserver/moto:5.2.1
      - name: Moto honours conditional writes
        run: yarn vitest run tests/functions/s3-records.moto.test.ts
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
      - run: yarn build
      - run: yarn test:e2e
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
      - run: yarn test:a11y
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            district-survey/reports/playwright.json
            district-survey/reports/playwright-a11y.json
            district-survey/test-results

  traceability:
    name: Goal traceability
    needs: [typescript, terraform, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: district-survey
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: district-survey/reports
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Every assigned goal has a passing tagged test
        run: node --experimental-strip-types scripts/check-traceability.ts --report reports/vitest.json --report reports/playwright.json --report reports/playwright-a11y.json --report reports/terraform-test.txt
