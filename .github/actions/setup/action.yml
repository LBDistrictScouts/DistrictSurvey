name: Set up the survey repository
description: >
  Installs dependencies, including the survey engine from GitHub Packages. The calling job needs
  `packages: read`.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install dependencies
      shell: bash
      working-directory: district-survey
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        corepack enable
        yarn install --immutable
