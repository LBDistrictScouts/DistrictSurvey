nodeLinker: node-modules

# The survey engine is published from DistrictWorkflow to GitHub Packages.
# CI reads it with the workflow's GITHUB_TOKEN. Locally, export a token with read:packages.
npmScopes:
  lbdistrictscouts:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${GITHUB_TOKEN-}"

# Our own packages skip the one-day age gate. They are published only by DistrictWorkflow's tag workflow.
npmPreapprovedPackages:
  - "@lbdistrictscouts/*"
